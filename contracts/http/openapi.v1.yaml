openapi: 3.1.0
info:
  title: Marketplace de serviços locais
  version: 1.3.0
  description: >-
    Contrato da descoberta pública e do fluxo demonstrativo privado de pedido,
    proposta versionada e contrato aguardando pagamento. A identidade
    demonstrativa é proibida em produção e nenhuma rota deste incremento captura
    pagamento ou cria lançamento contábil.
servers:
  - url: http://localhost:3000/api/v1
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [health]
      responses:
        '200':
          description: Processo ativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
  /health/ready:
    get:
      operationId: getReadiness
      tags: [health]
      responses:
        '200':
          description: Dependências críticas disponíveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      responses:
        '200':
          description: Categorias públicas ativas
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  meta:
                    $ref: '#/components/schemas/Meta'
  /search/professionals:
    get:
      operationId: searchProfessionals
      tags: [catalog]
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 80
        - name: category
          in: query
          schema:
            type: string
            pattern: '^[a-z0-9-]+$'
        - name: city
          in: query
          schema:
            type: string
            maxLength: 80
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 500
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 12
      responses:
        '200':
          description: Perfis públicos elegíveis
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProfessionalCard'
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - type: object
                        properties:
                          next_cursor:
                            type: string
                          total:
                            type: integer
                            minimum: 0
        '400':
          $ref: '#/components/responses/ValidationError'
  /professionals/{slug}:
    get:
      operationId: getProfessional
      tags: [catalog]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Perfil público
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/ProfessionalProfile'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '404':
          $ref: '#/components/responses/NotFound'
  /intents:
    post:
      operationId: createRestrictedIntent
      tags: [intents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [professionalId, serviceId, action]
              properties:
                professionalId:
                  type: string
                  format: uuid
                serviceId:
                  type: string
                  format: uuid
                action:
                  type: string
                  const: REQUEST_QUOTE
      responses:
        '201':
          description: Intenção opaca válida por 30 minutos
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/RestrictedIntent'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /demo/actors:
    get:
      operationId: listDemoActors
      tags: [development]
      summary: Lista identidades exclusivamente sintéticas
      description: Esta operação não existe quando a aplicação executa em produção.
      responses:
        '200':
          description: Atores sintéticos disponíveis para a demonstração
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoActorsEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /service-requests:
    post:
      operationId: createServiceRequest
      tags: [marketplace]
      security:
        - DemoActor: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequestInput'
      responses:
        '201':
          description: Pedido privado criado como rascunho
          headers:
            ETag:
              $ref: '#/components/headers/ResourceVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    get:
      operationId: listServiceRequests
      tags: [marketplace]
      security:
        - DemoActor: []
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [mine, opportunities]
      responses:
        '200':
          description: Pedidos próprios ou oportunidades sanitizadas conforme o papel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestsEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /service-requests/{requestId}:
    get:
      operationId: getServiceRequest
      tags: [marketplace]
      security:
        - DemoActor: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Detalhe permitido ao cliente dono ou profissional elegível
          headers:
            ETag:
              $ref: '#/components/headers/ResourceVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /service-requests/{requestId}/publish:
    post:
      operationId: publishServiceRequest
      tags: [marketplace]
      security:
        - DemoActor: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Pedido publicado para profissionais elegíveis
          headers:
            ETag:
              $ref: '#/components/headers/ResourceVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /service-requests/{requestId}/proposals:
    get:
      operationId: listRequestProposals
      tags: [marketplace]
      security:
        - DemoActor: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Propostas visíveis à parte autorizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createProposal
      tags: [marketplace]
      security:
        - DemoActor: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalRevisionInput'
      responses:
        '201':
          description: Proposta e primeira revisão imutável criadas
          headers:
            ETag:
              $ref: '#/components/headers/ResourceVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /opportunities:
    get:
      operationId: listOpportunities
      tags: [marketplace]
      description: >-
        Alias de leitura para profissionais sintéticos. Retorna somente pedidos
        publicados, sanitizados e elegíveis por categoria, serviço publicado e
        área ativa com cidade e UF compatíveis.
      security:
        - DemoActor: []
      responses:
        '200':
          description: Oportunidades privadas elegíveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /proposals/{proposalId}/revisions:
    get:
      operationId: listProposalRevisions
      tags: [marketplace]
      security:
        - DemoActor: []
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: Histórico append-only visível às partes autorizadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalRevisionsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: reviseProposal
      tags: [marketplace]
      security:
        - DemoActor: []
      parameters:
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalRevisionInput'
      responses:
        '201':
          description: Nova revisão anexada sem alterar a anterior
          headers:
            ETag:
              $ref: '#/components/headers/ResourceVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /proposals/{proposalId}/accept:
    post:
      operationId: acceptProposal
      tags: [marketplace]
      security:
        - DemoActor: []
      parameters:
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptProposalInput'
      responses:
        '200':
          description: >-
            Aceite atômico; contrato e ordem continuam aguardando pagamento e o
            hold não representa booking confirmado
          headers:
            ETag:
              $ref: '#/components/headers/ResourceVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalAcceptanceEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /contracts/{contractId}:
    get:
      operationId: getContract
      tags: [contracting]
      security:
        - DemoActor: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: Snapshot imutável e estados financeiro e de agenda separados
          headers:
            ETag:
              $ref: '#/components/headers/ResourceVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalAcceptanceEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    DemoActor:
      type: apiKey
      in: header
      name: X-Demo-Actor-Id
      description: >-
        Identificador de ator sintético, resolvido no servidor. Este esquema é
        proibido em produção e não representa autenticação real.
  headers:
    ResourceVersion:
      description: Versão forte do agregado para uso posterior em If-Match.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        example: '"2"'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: >-
        Chave opaca única por ator, operação e corpo da requisição. O resultado
        fica disponível para replay por 24 horas; clientes não devem reutilizar
        deliberadamente a chave depois desse prazo.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        example: '"2"'
      description: Versão otimista atual do agregado.
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContractId:
      name: contractId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ValidationError:
      description: Entrada inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Recurso inexistente ou não visível
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Dependência temporariamente indisponível
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Ator ausente ou identidade demonstrativa indisponível
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: O papel autenticado não pode executar a operação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Conflito de versão, idempotência, agenda ou estado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: Regra de negócio não satisfeita
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Meta:
      type: object
      required: [correlation_id]
      properties:
        correlation_id:
          type: string
          format: uuid
    HealthEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [ok, ready]
        meta:
          $ref: '#/components/schemas/Meta'
    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        currency:
          type: string
          const: BRL
    Category:
      type: object
      required: [id, slug, name, description, iconKey, availableProfessionals]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        iconKey:
          type: string
        availableProfessionals:
          type: integer
          minimum: 0
    VerificationBadge:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
          enum: [IDENTITY_CONFIRMED, PHONE_CONFIRMED, PAYOUT_ACCOUNT_CONFIRMED]
        label:
          type: string
    Service:
      type: object
      required: [id, slug, name, category, pricing, modalities, durationMinutes, summary]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        category:
          type: object
          required: [slug, name]
          properties:
            slug:
              type: string
            name:
              type: string
        pricing:
          type: object
          required: [model, from, unitLabel]
          properties:
            model:
              type: string
              enum: [FIXED, HOURLY, DAILY, STARTING_AT, CUSTOM_QUOTE]
            from:
              oneOf:
                - $ref: '#/components/schemas/Money'
                - type: 'null'
            unitLabel:
              type: string
        modalities:
          type: array
          minItems: 1
          items:
            type: string
            enum: [AT_CLIENT, AT_PROFESSIONAL, REMOTE]
        durationMinutes:
          type: [integer, 'null']
          minimum: 1
        summary:
          type: string
    ProfessionalCard:
      type: object
      required:
        - id
        - slug
        - displayName
        - initials
        - headline
        - regionLabel
        - rating
        - completedServices
        - responseTimeLabel
        - availabilityLabel
        - badges
        - primaryService
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        displayName:
          type: string
        initials:
          type: string
        headline:
          type: string
        regionLabel:
          type: string
        rating:
          type: object
          required: [average, count]
          properties:
            average:
              type: [number, 'null']
              minimum: 1
              maximum: 5
            count:
              type: integer
              minimum: 0
        completedServices:
          type: integer
          minimum: 0
        responseTimeLabel:
          type: string
        availabilityLabel:
          type: string
        badges:
          type: array
          items:
            $ref: '#/components/schemas/VerificationBadge'
        primaryService:
          $ref: '#/components/schemas/Service'
    ProfessionalProfile:
      allOf:
        - $ref: '#/components/schemas/ProfessionalCard'
        - type: object
          required: [bio, serviceAreas, services, policies]
          properties:
            bio:
              type: string
            serviceAreas:
              type: array
              items:
                type: string
            services:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/Service'
            policies:
              type: object
              required: [cancellation, guarantee]
              properties:
                cancellation:
                  type: string
                guarantee:
                  type: [string, 'null']
    RestrictedIntent:
      type: object
      required: [id, action, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          const: REQUEST_QUOTE
        expiresAt:
          type: string
          format: date-time
    DemoActor:
      oneOf:
        - type: object
          additionalProperties: false
          required: [id, role, displayName, professionalId]
          properties:
            id:
              type: string
              format: uuid
            role:
              type: string
              const: CLIENT
            displayName:
              type: string
              minLength: 1
            professionalId:
              type: 'null'
        - type: object
          additionalProperties: false
          required: [id, role, displayName, professionalId]
          properties:
            id:
              type: string
              format: uuid
            role:
              type: string
              const: PROFESSIONAL
            displayName:
              type: string
              minLength: 1
            professionalId:
              type: string
              format: uuid
    ApproximateLocation:
      type: object
      additionalProperties: false
      required: [city, state]
      properties:
        city:
          type: string
          minLength: 2
          maxLength: 80
        state:
          type: string
          pattern: '^[A-Z]{2}$'
        district:
          type: [string, 'null']
          minLength: 2
          maxLength: 80
    DesiredWindow:
      type: object
      additionalProperties: false
      required: [startsAt, endsAt, timezone]
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        timezone:
          type: string
          minLength: 1
          maxLength: 80
          example: America/Bahia
    RequestBudget:
      type: object
      additionalProperties: false
      required: [currency]
      properties:
        minMinor:
          type: [integer, 'null']
          minimum: 0
          maximum: 9007199254740991
        maxMinor:
          type: [integer, 'null']
          minimum: 0
          maximum: 9007199254740991
        currency:
          type: string
          const: BRL
    CreateServiceRequestInput:
      type: object
      additionalProperties: false
      required:
        - categoryId
        - title
        - description
        - locationApprox
        - desiredWindow
        - urgency
        - visibility
        - proposalDeadline
      properties:
        categoryId:
          type: string
          format: uuid
          description: >-
            Referência provisória à categoria do piloto. Será substituída por
            subcategoryId quando a taxonomia versionada for implementada.
        title:
          type: string
          minLength: 10
          maxLength: 120
        description:
          type: string
          minLength: 20
          maxLength: 2000
        locationApprox:
          $ref: '#/components/schemas/ApproximateLocation'
        desiredWindow:
          $ref: '#/components/schemas/DesiredWindow'
        urgency:
          type: string
          enum: [FLEXIBLE, WITHIN_7_DAYS, URGENT]
        budget:
          oneOf:
            - $ref: '#/components/schemas/RequestBudget'
            - type: 'null'
        visibility:
          type: string
          const: PRIVATE_MATCHED
        proposalDeadline:
          type: string
          format: date-time
    ServiceRequest:
      type: object
      required:
        - id
        - title
        - description
        - category
        - locationApprox
        - desiredWindow
        - urgency
        - budget
        - visibility
        - status
        - version
        - proposalDeadline
        - proposalCount
        - createdAt
        - publishedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        category:
          type: object
          required: [id, slug, name]
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
            name:
              type: string
        locationApprox:
          $ref: '#/components/schemas/ApproximateLocation'
        desiredWindow:
          $ref: '#/components/schemas/DesiredWindow'
        urgency:
          type: string
          enum: [FLEXIBLE, WITHIN_7_DAYS, URGENT]
        budget:
          oneOf:
            - $ref: '#/components/schemas/RequestBudget'
            - type: 'null'
        visibility:
          type: string
          const: PRIVATE_MATCHED
        status:
          type: string
          enum: [DRAFT, PUBLISHED, CONVERTED, CANCELLED, EXPIRED]
        version:
          type: integer
          minimum: 1
        proposalDeadline:
          type: string
          format: date-time
        proposalCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: [string, 'null']
          format: date-time
    ProposalRevisionInput:
      type: object
      additionalProperties: false
      required: [scope, included, excluded, amounts, schedule, validUntil, guaranteeOffer]
      properties:
        scope:
          type: string
          minLength: 20
          maxLength: 4000
        included:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 2
            maxLength: 240
        excluded:
          type: array
